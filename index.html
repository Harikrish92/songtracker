<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1330">
<meta name="description" content="Track YouTube content by category — ideas, videos in progress and posted videos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hari Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Hari Log</title>
<style>
  :root{
    --bg: #1b1330;
    --bg-panel: #241a3d;
    --gold: #d4af37;
    --gold-soft: #e8cd6f;
    --text: #f2ead9;
    --text-dim: #b6acc9;
    --line: #3a2c5c;
    --danger: #e07a7a;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, #2a1f4a 0%, transparent 55%),
      radial-gradient(circle at 90% 100%, #2a1f4a 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    padding: 28px 16px 60px;
    padding-top: calc(28px + env(safe-area-inset-top));
    padding-bottom: calc(60px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:1200px;margin:0 auto;}
  .columns{
    display:grid;
    grid-template-columns:repeat(3, minmax(0, 1fr));
    gap:24px;
    align-items:start;
  }
  @media (max-width:900px){
    .columns{grid-template-columns:1fr;gap:0;}
  }
  @media (max-width:480px){
    body{
      padding:20px 12px 48px;
      padding-top:calc(20px + env(safe-area-inset-top));
      padding-bottom:calc(48px + env(safe-area-inset-bottom));
    }
    h1{font-size:21px;}
    .eyebrow{font-size:10px;letter-spacing:2px;}
    .subtitle{font-size:12px;}
    .section-title{font-size:16px;}
    li.song{padding:10px 12px;}
    .song-name{font-size:15px;}
  }
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);border:0;
  }
  header{
    text-align:center;
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    letter-spacing:3px;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold-soft);
    margin-bottom:6px;
  }
  h1{
    margin:0;
    font-size:24px;
    font-weight:400;
    color:var(--text);
  }
  .subtitle{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:8px;
    line-height:1.5;
  }

  .category-bar{
    display:flex;
    gap:8px;
    align-items:center;
    max-width:560px;
    margin:0 auto 24px;
  }
  .category-bar select{
    flex:1;
    min-width:0;
    min-height:44px;
    padding:0 40px 0 14px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:
      linear-gradient(45deg, transparent 50%, var(--gold-soft) 50%) right 20px center / 6px 6px no-repeat,
      linear-gradient(135deg, var(--gold-soft) 50%, transparent 50%) right 14px center / 6px 6px no-repeat,
      var(--bg-panel);
    color:var(--text);
    font-family:'Georgia', 'Iowan Old Style', serif;
    font-size:17px;
    outline:none;
    appearance:none;
    -webkit-appearance:none;
    cursor:pointer;
  }
  .category-bar select:focus{border-color:var(--gold-soft);}
  .category-bar select option{background:var(--bg-panel);color:var(--text);}
  .icon-btn{
    background:var(--bg-panel);
    border:1px solid var(--line);
    color:var(--gold-soft);
    border-radius:8px;
    min-width:44px;
    min-height:44px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--gold-soft);}
  .icon-btn.danger:hover{border-color:var(--danger);color:var(--danger);}

  section.block{margin-bottom:34px;}
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .section-title{
    font-size:18px;
    font-weight:400;
    color:var(--gold-soft);
  }
  .count-label{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    color:var(--text-dim);
  }

  .text-input{
    width:100%;
    padding:10px 14px;
    min-height:44px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--bg-panel);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:16px;
    outline:none;
  }
  .text-input:focus{border-color:var(--gold-soft);}
  .text-input::placeholder{color:var(--text-dim);}
  .search-row{margin-bottom:12px;}

  .add-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .add-row .text-input{flex:1;min-width:0;}
  .primary-btn{
    background: var(--gold);
    color:#1b1330;
    border:none;
    border-radius:8px;
    padding:0 18px;
    min-height:44px;
    min-width:56px;
    flex-shrink:0;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
  }
  .primary-btn:hover{background:var(--gold-soft);}
  .ghost-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--text-dim);
    border-radius:8px;
    padding:0 16px;
    min-height:44px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--text-dim);color:var(--text);}

  ul.list{list-style:none;margin:0;padding:0;}
  li.song{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .idx{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11px;
    color:var(--text-dim);
    width:20px;
    flex-shrink:0;
  }
  .item-body{flex:1;min-width:0;}
  .song-name{
    display:block;
    font-size:15.5px;
    line-height:1.3;
    overflow-wrap:break-word;
  }
  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-top:4px;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px;
    color:var(--text-dim);
  }
  .meta:empty{display:none;}
  .meta a{color:var(--gold-soft);text-decoration:none;}
  .meta a:hover{text-decoration:underline;}
  .actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
    margin-left:auto;
  }
  .done-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--gold-soft);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    padding:5px 10px;
    min-height:36px;
    border-radius:16px;
    cursor:pointer;
    white-space:nowrap;
    margin-right:4px;
  }
  .done-btn:hover{border-color:var(--gold-soft); background:rgba(212,175,55,0.08);}
  .mini-btn{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
    line-height:1;
    padding:8px;
    min-width:36px;
    min-height:36px;
  }
  .mini-btn:hover{color:var(--text);}
  .mini-btn.remove{font-size:18px;}
  .mini-btn.remove:hover{color:var(--danger);}

  .edit-form{width:100%;display:flex;flex-direction:column;gap:8px;}
  .edit-form label{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11px;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .edit-form .text-input{margin-top:4px;color-scheme:dark;}
  .edit-buttons{display:flex;gap:8px;justify-content:flex-end;}

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13px;
    padding:20px 0;
  }
  .loading{text-align:center; color:var(--text-dim); font-family:sans-serif; font-size:13px; padding:40px 0;}
  .sync-status{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:11px;
    color:var(--text-dim);
    margin-top:10px;
  }
  .sync-status.offline{color:#e0a97a;}
</style>

<body>
<div class="wrap">
  <header>
    <div class="eyebrow">YouTube Content Tracker</div>
    <h1>Hari Log</h1>
    <div class="subtitle">Pick a category, line up ideas in To-do,<br>move them to In progress while creating, and to Posted once live.</div>
    <div class="sync-status" id="syncStatus"></div>
  </header>

  <div id="loading" class="loading">Loading your content…</div>

  <div id="content" style="display:none;">
    <div class="category-bar">
      <label for="categorySelect" class="sr-only">Category</label>
      <select id="categorySelect"></select>
      <button class="icon-btn" id="newCategoryBtn" title="New category" aria-label="New category">＋</button>
      <button class="icon-btn" id="renameCategoryBtn" title="Rename category" aria-label="Rename category">✎</button>
      <button class="icon-btn danger" id="deleteCategoryBtn" title="Delete category" aria-label="Delete category">✕</button>
    </div>

    <div class="columns">
      <section class="block" data-stage="todo">
        <div class="section-head">
          <div class="section-title">To-do</div>
          <div class="count-label"></div>
        </div>
        <div class="add-row">
          <input type="text" class="text-input add-input" placeholder="Add a video idea…">
          <button class="primary-btn add-btn">Add</button>
        </div>
        <ul class="list"></ul>
        <div class="empty">Nothing queued up yet.</div>
      </section>

      <section class="block" data-stage="doing">
        <div class="section-head">
          <div class="section-title">In progress</div>
          <div class="count-label"></div>
        </div>
        <div class="add-row">
          <input type="text" class="text-input add-input" placeholder="Add a video you're making…">
          <button class="primary-btn add-btn">Add</button>
        </div>
        <ul class="list"></ul>
        <div class="empty">Nothing in production right now.</div>
      </section>

      <section class="block" data-stage="posted">
        <div class="section-head">
          <div class="section-title">Posted</div>
          <div class="count-label"></div>
        </div>
        <div class="search-row">
          <input type="text" class="text-input" id="searchInput" placeholder="Search posted videos…">
        </div>
        <div class="add-row">
          <input type="text" class="text-input add-input" placeholder="Add an already-posted video…">
          <button class="primary-btn add-btn">Add</button>
        </div>
        <ul class="list"></ul>
        <div class="empty"></div>
      </section>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBCDHwGUHKyM_t_iOb4a9NBBi2Lpw6Kg1k",
  authDomain: "hari-log.firebaseapp.com",
  projectId: "hari-log",
  storageBucket: "hari-log.firebasestorage.app",
  messagingSenderId: "836620841342",
  appId: "1:836620841342:web:4f6d787835ad09bba2032f",
  measurementId: "G-MKC34M1BTS"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection('songtracker').doc('035fbd6c3b1d4fa8b3aa08a86d41528a');

// Category the old song-only data gets moved into on first load.
const LEGACY_CATEGORY = "Let's Find The Song";
const SELECTED_KEY = 'hari-log-category';

const STAGES = {
  todo:   { countWord: 'queued',      forward: { label: 'Start',       to: 'doing'  } },
  doing:  { countWord: 'in progress', forward: { label: 'Mark posted', to: 'posted' }, back: 'todo' },
  posted: { countWord: 'posted',      back: 'doing' }
};

// Shape: [{ id, name, items: [{ id, title, status: 'todo'|'doing'|'posted', url, postedAt: 'YYYY-MM-DD' }] }]
let categories = [];
let selectedId = null;
let docLoaded = false;
// Inline edit in progress; kept here so a sync from another device doesn't wipe what's being typed.
let editing = null;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function today() {
  return new Date().toLocaleDateString('en-CA');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function normalizeUrl(raw) {
  const url = (raw || '').trim();
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://' + url;
}

function formatDate(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  if (!y || !m || !d) return ymd;
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

function newItem(title, status) {
  return { id: uid(), title, status, url: '', postedAt: status === 'posted' ? today() : '' };
}

function migrateLegacy(data) {
  const items = [
    ...(data.todo || []).map((t) => newItem(t, 'todo')),
    ...(data.completed || []).map((t) => ({ ...newItem(t, 'posted'), postedAt: '' }))
  ];
  return [{ id: uid(), name: LEGACY_CATEGORY, items }];
}

function loadSelected() {
  try { return localStorage.getItem(SELECTED_KEY); } catch (e) { return null; }
}

function storeSelected(id) {
  try { localStorage.setItem(SELECTED_KEY, id); } catch (e) { /* storage unavailable */ }
}

function currentCategory() {
  return categories.find((c) => c.id === selectedId) || null;
}

function findItem(id) {
  const cat = currentCategory();
  return cat ? cat.items.find((i) => i.id === id) : null;
}

function setSyncStatus(fromCache) {
  const statusEl = document.getElementById('syncStatus');
  if (fromCache) {
    statusEl.textContent = 'Offline — showing last synced data';
    statusEl.classList.add('offline');
  } else {
    statusEl.textContent = 'Synced across devices';
    statusEl.classList.remove('offline');
  }
}

function showContent() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = '';
}

docRef.onSnapshot(async (snap) => {
  const data = snap.exists ? snap.data() : {};
  if (Array.isArray(data.categories)) {
    categories = data.categories;
  } else {
    categories = migrateLegacy(data);
    // Only write the migration once the server has confirmed there's no category data yet.
    if (!snap.metadata.fromCache) await saveAll();
  }
  docLoaded = true;
  setSyncStatus(snap.metadata.fromCache);
  showContent();
  renderAll();
}, (err) => {
  console.error('Sync error', err);
  if (!docLoaded) {
    document.getElementById('loading').textContent = 'Could not load your content. Check your connection and reload.';
  }
  setSyncStatus(true);
});

async function saveAll() {
  // Merge keeps the legacy todo/completed fields around as a backup.
  try { await docRef.set({ categories }, { merge: true }); }
  catch (e) { console.error('Save failed', e); }
}

function commit() {
  renderAll();
  saveAll();
}

function renderAll() {
  if (!categories.some((c) => c.id === selectedId)) {
    const stored = loadSelected();
    selectedId = categories.some((c) => c.id === stored) ? stored : (categories[0] ? categories[0].id : null);
  }
  renderCategorySelect();
  Object.keys(STAGES).forEach(renderStage);
}

function renderCategorySelect() {
  const select = document.getElementById('categorySelect');
  select.innerHTML = categories.length
    ? categories.map((c) =>
        `<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)} (${c.items.length})</option>`
      ).join('')
    : '<option value="">No categories yet</option>';
  select.value = selectedId || '';
  document.getElementById('renameCategoryBtn').disabled = !selectedId;
  document.getElementById('deleteCategoryBtn').disabled = !selectedId;
  document.querySelector('.columns').style.display = selectedId ? '' : 'none';
}

function renderStage(stage) {
  const section = document.querySelector(`section[data-stage="${stage}"]`);
  const listEl = section.querySelector('ul.list');
  const emptyMsg = section.querySelector('.empty');
  const countLabel = section.querySelector('.count-label');
  const cat = currentCategory();
  const all = cat ? cat.items.filter((i) => i.status === stage) : [];

  let shown = all;
  let query = '';
  if (stage === 'posted') {
    query = document.getElementById('searchInput').value.trim().toLowerCase();
    shown = all.filter((i) => i.title.toLowerCase().includes(query));
    emptyMsg.textContent = all.length ? 'No videos match your search.' : 'Nothing posted yet.';
  }

  countLabel.textContent = query ? `${shown.length} of ${all.length}` : `${all.length} ${STAGES[stage].countWord}`;
  listEl.style.display = shown.length ? 'block' : 'none';
  emptyMsg.style.display = shown.length ? 'none' : 'block';
  listEl.innerHTML = shown.map((item, idx) =>
    editing && editing.id === item.id ? renderEditForm(item) : renderItem(item, idx)
  ).join('');
}

function renderItem(item, idx) {
  const stage = STAGES[item.status];
  const meta = [];
  if (item.url) meta.push(`<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">▶ Watch</a>`);
  if (item.postedAt) meta.push(`<span>${escapeHtml(formatDate(item.postedAt))}</span>`);
  return `
    <li class="song" data-id="${escapeHtml(item.id)}">
      <span class="idx">${idx + 1}</span>
      <div class="item-body">
        <span class="song-name">${escapeHtml(item.title)}</span>
        <div class="meta">${meta.join('')}</div>
      </div>
      <div class="actions">
        ${stage.forward ? `<button class="done-btn" data-action="forward">${stage.forward.label}</button>` : ''}
        ${stage.back ? `<button class="mini-btn" data-action="back" title="Move back" aria-label="Move back">↩</button>` : ''}
        <button class="mini-btn" data-action="edit" title="Edit" aria-label="Edit">✎</button>
        <button class="mini-btn remove" data-action="remove" title="Remove" aria-label="Remove">✕</button>
      </div>
    </li>`;
}

function renderEditForm(item) {
  return `
    <li class="song" data-id="${escapeHtml(item.id)}">
      <div class="edit-form">
        <label>Title
          <input type="text" class="text-input" data-field="title" value="${escapeHtml(editing.title)}">
        </label>
        <label>YouTube link
          <input type="url" class="text-input" data-field="url" value="${escapeHtml(editing.url)}" placeholder="https://youtu.be/…">
        </label>
        ${item.status === 'posted' ? `
        <label>Posted on
          <input type="date" class="text-input" data-field="postedAt" value="${escapeHtml(editing.postedAt)}">
        </label>` : ''}
        <div class="edit-buttons">
          <button class="ghost-btn" data-action="cancel-edit">Cancel</button>
          <button class="primary-btn" data-action="save-edit">Save</button>
        </div>
      </div>
    </li>`;
}

function moveItem(item, to) {
  const cat = currentCategory();
  // Moved items go to the end of their new list.
  cat.items = cat.items.filter((i) => i.id !== item.id);
  item.status = to;
  if (to === 'posted') {
    if (!item.postedAt) item.postedAt = today();
    if (!item.url) {
      const link = prompt('YouTube link for this video (optional):', '');
      if (link) item.url = normalizeUrl(link);
    }
  } else {
    item.postedAt = '';
  }
  cat.items.push(item);
}

function handleListClick(e) {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const li = btn.closest('li[data-id]');
  const item = findItem(li.dataset.id);
  if (!item) return;
  const stage = STAGES[item.status];

  switch (btn.dataset.action) {
    case 'forward':
      moveItem(item, stage.forward.to);
      commit();
      break;
    case 'back':
      moveItem(item, stage.back);
      commit();
      break;
    case 'remove': {
      const cat = currentCategory();
      cat.items = cat.items.filter((i) => i.id !== item.id);
      commit();
      break;
    }
    case 'edit':
      editing = { id: item.id, title: item.title, url: item.url || '', postedAt: item.postedAt || '' };
      renderAll();
      document.querySelector(`li[data-id="${item.id}"] [data-field="title"]`).focus();
      break;
    case 'cancel-edit':
      editing = null;
      renderAll();
      break;
    case 'save-edit': {
      const title = editing.title.trim();
      if (!title) return;
      item.title = title;
      item.url = normalizeUrl(editing.url);
      if (item.status === 'posted') item.postedAt = editing.postedAt;
      editing = null;
      commit();
      break;
    }
  }
}

function handleListInput(e) {
  const field = e.target.dataset.field;
  if (editing && field) editing[field] = e.target.value;
}

function handleListKeydown(e) {
  if (!editing || !e.target.dataset.field) return;
  const li = e.target.closest('li[data-id]');
  if (e.key === 'Enter') li.querySelector('[data-action="save-edit"]').click();
  if (e.key === 'Escape') li.querySelector('[data-action="cancel-edit"]').click();
}

document.querySelectorAll('section[data-stage]').forEach((section) => {
  const stage = section.dataset.stage;
  const listEl = section.querySelector('ul.list');
  const input = section.querySelector('.add-input');

  listEl.addEventListener('click', handleListClick);
  listEl.addEventListener('input', handleListInput);
  listEl.addEventListener('keydown', handleListKeydown);

  const add = () => {
    const cat = currentCategory();
    const title = input.value.trim();
    if (!cat || !title) return;
    cat.items.push(newItem(title, stage));
    input.value = '';
    commit();
  };
  section.querySelector('.add-btn').addEventListener('click', add);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') add(); });
});

document.getElementById('searchInput').addEventListener('input', () => renderStage('posted'));

document.getElementById('categorySelect').addEventListener('change', (e) => {
  selectedId = e.target.value;
  storeSelected(selectedId);
  editing = null;
  document.getElementById('searchInput').value = '';
  renderAll();
});

document.getElementById('newCategoryBtn').addEventListener('click', () => {
  const name = (prompt('New category name:') || '').trim();
  if (!name) return;
  const cat = { id: uid(), name, items: [] };
  categories.push(cat);
  selectedId = cat.id;
  storeSelected(selectedId);
  commit();
});

document.getElementById('renameCategoryBtn').addEventListener('click', () => {
  const cat = currentCategory();
  if (!cat) return;
  const name = (prompt('Rename category:', cat.name) || '').trim();
  if (!name || name === cat.name) return;
  cat.name = name;
  commit();
});

document.getElementById('deleteCategoryBtn').addEventListener('click', () => {
  const cat = currentCategory();
  if (!cat) return;
  const count = cat.items.length;
  const msg = count
    ? `Delete "${cat.name}" and its ${count} item${count === 1 ? '' : 's'}? This can't be undone.`
    : `Delete "${cat.name}"?`;
  if (!confirm(msg)) return;
  categories = categories.filter((c) => c.id !== cat.id);
  selectedId = null;
  commit();
});
</script>
</body>
</html>
